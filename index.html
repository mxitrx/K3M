<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3M Finance </title>
  <link rel="icon" href="123.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { 
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'sans-serif'] },
          colors: {
            brand: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
            zinc: { 850: '#1f1f22', 900: '#18181b', 950: '#09090b' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #09090b;
      color: #e4e4e7;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Clean Loader */
    .loader-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #27272a;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    /* Elegant Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #f97316; }

    /* Neat Inputs */
    .neat-input {
      background-color: #18181b;
      border: 1px solid #27272a;
      color: #ffffff;
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .neat-input:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 1px #f97316;
    }
    .neat-input::placeholder { color: #71717a; }
  </style>
</head>

<body class="min-h-screen flex flex-col selection:bg-brand-500 selection:text-white">

  <!-- Loader -->
  <div id="loader" class="loader-overlay hidden">
    <div class="flex flex-col items-center gap-3">
      <div class="spinner"></div>
      <p class="text-zinc-400 text-sm font-medium">กำลังดำเนินการ...</p>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrModal" class="loader-overlay hidden">
    <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm mx-4 relative shadow-2xl">
      <button onclick="closeQR()" class="absolute top-4 right-4 text-zinc-500 hover:text-white transition-colors p-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="text-center mb-5">
        <h3 class="text-xs font-medium text-zinc-400 uppercase tracking-widest mb-1">โอนเงินให้</h3>
        <div id="qrTargetName" class="text-lg font-bold text-white"></div>
      </div>
      
      <div class="flex justify-center mb-5">
        <div class="p-2 bg-white rounded-xl shadow-sm border border-zinc-200">
          <img id="qrImage" src="" alt="PromptPay QR" class="w-44 h-44 object-contain">
        </div>
      </div>
      
      <div class="bg-zinc-950 rounded-lg p-3 mb-4 flex items-center justify-between border border-zinc-800">
        <div class="text-left">
            <div class="text-[10px] text-zinc-500 font-semibold uppercase mb-0.5">PromptPay ID</div>
            <div id="qrTargetID" class="text-base font-mono font-medium text-white tracking-wide"></div>
        </div>
        <button onclick="copyID()" class="bg-zinc-800 hover:bg-brand-600 text-white px-3 py-1.5 rounded-md text-xs font-medium transition-colors">คัดลอก</button>
      </div>
      
      <div>
        <input type="number" id="qrAmount" class="text-center font-mono font-bold text-xl bg-zinc-950 text-brand-400 border border-zinc-800 rounded-lg p-3 w-full focus:outline-none focus:border-brand-500 transition-colors placeholder-zinc-700" placeholder="0.00" step="0.01" oninput="refreshQR()">
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="w-full px-6 py-4 flex justify-between items-center sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-sm border-b border-zinc-800">
    <div class="flex items-center gap-3">
      <img src="123.png" alt="K3M" class="h-9 w-9 rounded-md border border-zinc-800 object-cover bg-zinc-900">
      <div>
        <h1 class="text-sm font-bold text-white">ระบบบันทึกเงิน</h1>
        <p class="text-[10px] text-brand-500 font-semibold tracking-widest uppercase">K3M Studio</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto py-8 px-4 sm:px-6 flex-1 flex flex-col gap-8">
    
    <!-- Balance Section -->
    <section class="flex flex-col items-center justify-center py-4">
      <h2 class="text-xs font-medium text-zinc-400 mb-2 uppercase tracking-widest">ยอดเงินกองกลางคงเหลือ</h2>
      <div class="flex items-baseline gap-2">
        <p id="balanceText" class="text-5xl font-bold text-white tracking-tight">0.00</p>
        <span class="text-xl text-zinc-500 font-semibold">฿</span>
      </div>
    </section>

    <!-- Forms Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Income Form -->
      <section class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-6">
        <div class="flex items-center gap-2 mb-5">
          <div class="w-1.5 h-4 bg-emerald-500 rounded-sm"></div>
          <h3 class="font-semibold text-white text-sm">เพิ่มเงินเข้า (รายรับ)</h3>
        </div>
        <form id="incomeForm" class="flex flex-col gap-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <select id="incomeName" class="neat-input" required>
              <option value="">-- เลือกผู้ทำรายการ --</option>
            </select>
            <input type="number" id="incomeAmount" step="0.01" min="0" placeholder="จำนวนเงิน (บาท)" class="neat-input font-mono" required>
          </div>
          <textarea id="incomeDesc" placeholder="รายละเอียดเพิ่มเติม..." class="neat-input resize-none" rows="2"></textarea>
          <button type="submit" class="bg-white hover:bg-zinc-200 text-black font-semibold py-2.5 rounded-lg w-full transition-colors mt-1 text-sm">บันทึกรายรับ</button>
        </form>
      </section>

      <!-- Expense Form -->
      <section class="bg-zinc-900/50 border border-zinc-800 rounded-xl p-6">
        <div class="flex items-center gap-2 mb-5">
          <div class="w-1.5 h-4 bg-rose-500 rounded-sm"></div>
          <h3 class="font-semibold text-white text-sm">เอาเงินออก (เบิกจ่าย)</h3>
        </div>
        <form id="expenseForm" class="flex flex-col gap-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <select id="expenseName" class="neat-input" required>
              <option value="">-- เลือกผู้ทำรายการ --</option>
            </select>
            <input type="number" id="expenseAmount" step="0.01" min="0" placeholder="จำนวนเงิน (บาท)" class="neat-input font-mono" required>
          </div>
          <textarea id="expenseDesc" placeholder="รายละเอียดเพิ่มเติม..." class="neat-input resize-none" rows="2"></textarea>
          <button type="submit" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white font-semibold py-2.5 rounded-lg w-full transition-colors mt-1 text-sm">บันทึกรายจ่าย</button>
        </form>
      </section>

    </div>

    <!-- Data Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Team Members (Now Shows All Without Scroll) -->
      <section class="lg:col-span-4 bg-zinc-900/50 border border-zinc-800 rounded-xl p-5 flex flex-col h-fit">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-white text-sm">รายชื่อทีมงาน</h3>
        </div>
        <!-- เอาคลาส overflow-y-auto และ max-h-[400px] ออกเพื่อให้แสดงเต็ม -->
        <div id="personSummary" class="flex flex-col gap-1.5"></div>
      </section>

      <!-- Transaction History -->
      <section class="lg:col-span-8 bg-zinc-900/50 border border-zinc-800 rounded-xl flex flex-col overflow-hidden h-fit">
        <div class="p-5 border-b border-zinc-800 bg-zinc-900/80">
          <h3 class="font-semibold text-white text-sm">ประวัติธุรกรรมล่าสุด</h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="text-[11px] text-zinc-400 uppercase bg-zinc-950/50 border-b border-zinc-800 tracking-wide">
              <tr>
                <th class="px-5 py-3 font-medium whitespace-nowrap">วัน/เวลา</th>
                <th class="px-5 py-3 font-medium whitespace-nowrap">ชื่อ</th>
                <th class="px-5 py-3 font-medium text-center whitespace-nowrap">ประเภท</th>
                <th class="px-5 py-3 font-medium text-right whitespace-nowrap">จำนวนเงิน</th>
                <th class="px-5 py-3 font-medium">รายละเอียด</th>
              </tr>
            </thead>
            <tbody id="historyBody" class="divide-y divide-zinc-800/50 bg-transparent"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <footer class="w-full text-center py-6 text-zinc-500 text-xs font-medium border-t border-zinc-800 mt-auto bg-zinc-950">
    © 2026 K3M PRODUCTION
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzdZf-p40n7X--OMnjqMvw3KuqzwdalH1nQ53pl1iwjjiKPy4Zc1k-GVP_w8ukxoJ_JwA/exec";
    
    const MEMBERS = [
      { name: "คุณานนต์ มนตรีกานนท์", id: "0897737228" },
      { name: "นนท์วริศ ภิญโญหิรัญรัตน์", id: "0991049410" },
      { name: "นพอัปสร อ้นทอง", id: "0640299492" },
      { name: "นันธิดา น้อยพันธ์", id: "0823336707" },
      { name: "พัชรนันท์ วิโรจน์ชีวัน", id: "0907510003" },
      { name: "พิธานนท์ น่วมเศรษฐี", id: "0958870863" },
      { name: "รัชศักดิ์ ชลอุดมกุล", id: "0985155771" },
      { name: "วรพล ผลอินทร์", id: "0936104371" },
      { name: "อิทธิฤทธิ์ กุนศิริ", id: "0972653945" }
    ];

    function populateDropdowns() {
      const optionsHTML = '<option value="">-- เลือกผู้ทำรายการ --</option>' + 
        MEMBERS.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
      document.getElementById("incomeName").innerHTML = optionsHTML;
      document.getElementById("expenseName").innerHTML = optionsHTML;
    }
    populateDropdowns();

    const loader = document.getElementById('loader');
    const showLoader = () => loader.classList.remove('hidden');
    const hideLoader = () => loader.classList.add('hidden');

    let currentQRTarget = { name: "", id: "" };

    function openQR(name, defaultAmount) {
      const member = MEMBERS.find(m => m.name === name);
      if (!member) return alert("ไม่พบข้อมูล PromptPay");
      
      currentQRTarget = member;
      document.getElementById("qrTargetName").textContent = name;
      document.getElementById("qrTargetID").textContent = formatPhoneNumber(member.id);
      
      const input = document.getElementById("qrAmount");
      input.value = ""; 
      
      refreshQR(); 
      document.getElementById("qrModal").classList.remove("hidden");
      setTimeout(() => input.focus(), 100);
    }

    function refreshQR() {
      const rawVal = document.getElementById("qrAmount").value;
      const amount = parseFloat(rawVal) || 0;
      const url = `https://promptpay.io/${currentQRTarget.id}/${amount}.png`;
      document.getElementById("qrImage").src = url;
    }

    function closeQR() {
      document.getElementById("qrModal").classList.add("hidden");
    }

    function copyID() {
      navigator.clipboard.writeText(currentQRTarget.id).then(() => {
        const btn = document.querySelector("#qrModal button[onclick='copyID()']");
        const originalText = btn.textContent;
        btn.textContent = "คัดลอกแล้ว!";
        btn.classList.add("bg-brand-600", "text-white");
        btn.classList.remove("bg-zinc-800");
        setTimeout(() => {
            btn.textContent = originalText;
            btn.classList.remove("bg-brand-600", "text-white");
            btn.classList.add("bg-zinc-800");
        }, 1500);
      });
    }

    function formatPhoneNumber(phoneNumberString) {
      const cleaned = ('' + phoneNumberString).replace(/\D/g, '');
      const match = cleaned.match(/^(\d{3})(\d{3})(\d{4})$/);
      return match ? match[1] + '-' + match[2] + '-' + match[3] : phoneNumberString;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getFullYear()).slice(-2)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    async function loadSummary() {
      const res = await fetch(SCRIPT_URL + "?action=getSummary");
      const data = await res.json();
      const balance = (data.income || 0) - (data.expense || 0);
      
      const balanceEl = document.getElementById("balanceText");
      balanceEl.innerHTML = balance.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      balanceEl.className = balance >= 0 ? "text-5xl font-bold text-white tracking-tight" : "text-5xl font-bold text-rose-400 tracking-tight";

      const summaryDiv = document.getElementById("personSummary");
      summaryDiv.innerHTML = "";
      
      Object.entries(data.persons || {}).forEach(([name, total]) => {
        summaryDiv.innerHTML += `
          <div class="group px-4 py-2.5 flex justify-between items-center bg-zinc-900/50 hover:bg-zinc-800 rounded-lg transition-colors cursor-pointer border border-transparent hover:border-zinc-700" onclick="openQR('${name}', ${total})">
            <div class="font-medium text-[13px] text-zinc-300 group-hover:text-white">${name}</div>
            <button class="text-zinc-500 group-hover:text-brand-500 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
            </button>
          </div>`;
      });
    }

    async function loadHistory() {
      const res = await fetch(SCRIPT_URL + "?action=getHistory");
      const data = await res.json();
      const body = document.getElementById("historyBody");
      body.innerHTML = "";
      
      data.slice(0, 15).forEach(row => {
        const isIncome = row.type === "เงินเข้า";
        const typeStyle = isIncome ? "text-emerald-400 bg-emerald-500/10 border-emerald-500/20" : "text-rose-400 bg-rose-500/10 border-rose-500/20";
        const sign = isIncome ? "+" : "-";
        
        body.innerHTML += `
          <tr class="hover:bg-zinc-800/30 transition-colors">
            <td class="px-5 py-3 text-[12px] text-zinc-400 whitespace-nowrap">${formatDate(row.date)}</td>
            <td class="px-5 py-3 font-medium text-zinc-200 text-[13px] whitespace-nowrap">${row.name}</td>
            <td class="px-5 py-3 text-center whitespace-nowrap">
              <span class="px-2 py-0.5 rounded text-[10px] font-medium border ${typeStyle} whitespace-nowrap">${row.type}</span>
            </td>
            <td class="px-5 py-3 font-mono font-medium text-white text-right text-[13px] whitespace-nowrap">${sign}${Number(row.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
            <td class="px-5 py-3 text-[13px] text-zinc-400 truncate max-w-[150px] sm:max-w-xs">${row.desc}</td>
          </tr>`;
      });
    }

    async function submitForm(formId, actionType) {
      const form = document.getElementById(formId + "Form");
      const name = document.getElementById(formId + "Name").value;
      const amount = document.getElementById(formId + "Amount").value;
      const desc = document.getElementById(formId + "Desc").value;

      if (!name || !amount) {
        alert("กรุณากรอกข้อมูลให้ครบ");
        return;
      }

      showLoader();

      try {
        const formData = new FormData();
        formData.append("action", actionType);
        formData.append("personName", name);
        formData.append("amount", amount);
        formData.append("description", desc);

        const res = await fetch(SCRIPT_URL, { method: "POST", body: formData });
        const result = await res.json();

        if (result.result === "success") {
          form.reset();
          await Promise.all([loadSummary(), loadHistory()]);
        } else {
          alert("Error: " + result.message);
        }
      } catch (error) {
        console.error("Submit Error:", error);
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล โปรดลองอีกครั้ง");
      } finally {
        hideLoader();
      }
    }

    document.getElementById("incomeForm").onsubmit = e => { e.preventDefault(); submitForm("income", "addIncome"); };
    document.getElementById("expenseForm").onsubmit = e => { e.preventDefault(); submitForm("expense", "addExpense"); };

    async function initialLoad() {
      showLoader();
      try {
        await Promise.all([loadSummary(), loadHistory()]);
      } catch (error) {
        console.error("Initial Load Error:", error);
      } finally {
        hideLoader();
      }
    }

    initialLoad();
  </script>
</body>
</html>
